<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết bài nộp | ESSAY-GRADER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --primary:#2f6fb0;
    --primary-dark:#1f4e7a;
    --primary-light:#eaf3fc;
    --primary-lighter:#f5f9fd;
    --bg:#eef4fa;
    --card:#ffffff;
    --border:#e2ebf4;
    --text:#1e2b3d;
    --text-muted:#72879c;
    --success-bg:#e3f6ea; --success-text:#1f7a4d;
    --gray-bg:#eef2f7; --gray-text:#64748b;
    --content-clr:#2f6fb0;
    --org-clr:#2f6fb0;
    --lang-clr:#2f6fb0;
    --shadow: 0 1px 2px rgba(30,64,110,0.04), 0 8px 24px -12px rgba(30,64,110,0.14);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(900px 450px at 105% -10%, #e4f0fb 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    margin:0;
  }
  h1,h2,h3,.brand{ font-family:'Sora',sans-serif; }

  /* ---------- Topbar ---------- */
  nav{
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    padding:11px 28px;
    display:flex; align-items:center; gap:16px;
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:30;
  }
  .back-link{
    display:flex; align-items:center; gap:7px;
    color:var(--text-muted); text-decoration:none; font-weight:600; font-size:13px;
    padding:7px 13px; border-radius:8px; border:1px solid var(--border); background:var(--card);
    transition:.15s;
  }
  .back-link:hover{ color:var(--primary-dark); border-color:var(--primary); }
  .nav-divider{ width:1px; height:20px; background:var(--border); }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand-mark{ width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,#4a8fd6,#1f4e7a); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; }
  .brand-name{ font-weight:700; color:var(--primary-dark); font-size:14.5px; }

  /* ---------- Layout ---------- */
  .layout{ display:grid; grid-template-columns:1.5fr 1fr; gap:18px; padding:18px 28px 24px; align-items:start; max-width:1360px; margin:auto; }

  /* ---------- Left panel: viewer ---------- */
  .left-panel{ display:flex; flex-direction:column; gap:10px; position:sticky; top:66px; }
  .viewer-head-title{ font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:7px; color:var(--text); }
  .viewer-head-title i{ color:#e05252; }

  .viewer{
    flex-grow:1; min-height:72vh; background:var(--card); border-radius:14px; border:1px solid var(--border);
    box-shadow:var(--shadow); position:relative;
  }
  .viewer-placeholder{ display:flex; align-items:center; justify-content:center; flex-direction:column; width:100%;height:100%; text-align:center; color:var(--text-muted); }
  .viewer-placeholder i{ font-size:40px; color:#c9daea; margin-bottom:12px; }
  .viewer-placeholder p{ font-size:13px; margin:2px 0; }
  .viewer-toolbar{ position:absolute; bottom:14px; left:50%; transform:translateX(-50%); background:rgba(30,43,61,0.85); backdrop-filter:blur(6px); border-radius:10px; padding:7px 9px; display:flex; align-items:center; gap:4px; }
  .viewer-toolbar button{ width:30px; height:30px; border:none; background:transparent; color:#dce8f5; border-radius:6px; cursor:pointer; font-size:12.5px; }
  .viewer-toolbar button:hover{ background:rgba(255,255,255,0.12); }
  .viewer-toolbar span{ color:#dce8f5; font-size:12px; padding:0 7px; }

  /* ---------- Right panel ---------- */
  .right-panel{ display:flex; flex-direction:column; gap:12px; }

  .student-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow);
    padding:13px 18px; display:flex; align-items:center; gap:12px;
  }
  .student-avatar{ width:38px; height:38px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13.5px; flex-shrink:0; }
  .student-name{ font-size:15px; font-weight:700; line-height:1.2; }
  .student-meta{ font-size:12px; color:var(--text-muted); margin-top:1px; }
  .status-pill{ margin-left:auto; font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:20px; white-space:nowrap; }
  .status-ungraded{ background:var(--gray-bg); color:var(--gray-text); }
  .status-graded{ background:var(--success-bg); color:var(--success-text); }

  /* ---------- Total score card ---------- */
  .total-card{
    background:linear-gradient(150deg,#1f4e7a,#2f6fb0 60%,#3f81c6);
    border-radius:14px; padding:18px 20px; color:#fff; box-shadow:0 12px 26px -14px rgba(31,78,122,0.55);
    position:relative; overflow:hidden;
  }
  .total-card::after{ content:''; position:absolute; width:190px; height:190px; background:rgba(255,255,255,0.06); border-radius:50%; top:-80px; right:-60px; }
  .total-head{ display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1; }
  .total-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; opacity:.85; font-weight:700; }
  .total-value{ font-size:34px; font-weight:800; font-family:'Sora',sans-serif; line-height:1; margin-top:4px; }
  .total-value span{ font-size:16px; font-weight:600; opacity:.75; }
  .ai-badge{ background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; display:flex; align-items:center; gap:5px; }

  .stack-bar{ display:flex; height:9px; border-radius:6px; overflow:hidden; margin-top:14px; background:rgba(255,255,255,0.15); position:relative; z-index:1; }
  .stack-seg{ transition:width .3s ease; }
  .stack-legend{ display:flex; gap:14px; margin-top:9px; font-size:11px; position:relative; z-index:1; flex-wrap:wrap; }
  .stack-legend div{ display:flex; align-items:center; gap:5px; opacity:.9; }
  .stack-legend i{ width:7px; height:7px; border-radius:50%; display:inline-block; }

  /* ---------- Criteria (single compact card) ---------- */
  .criteria-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:4px 18px; }
  .criteria-row{ display:grid; grid-template-columns:26px 84px 1fr 46px; align-items:center; gap:12px; padding:12px 0; }
  .criteria-row + .criteria-row{ border-top:1px solid var(--border); }
  .criteria-icon{ width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:11.5px; color:#fff; flex-shrink:0; }
  .criteria-label{ font-weight:600; font-size:13.5px; cursor:help; }
  .criteria-score{ font-family:'Sora',sans-serif; font-weight:700; font-size:14.5px; color:var(--text); text-align:right; }
  .criteria-score span{ font-size:11.5px; color:var(--text-muted); font-weight:500; }

  input[type=range]{
    -webkit-appearance:none; width:100%; height:5px; border-radius:4px; background:var(--border); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--primary); border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.25); cursor:pointer; margin-top:-6px;
  }
  input[type=range]::-webkit-slider-runnable-track{ height:5px; border-radius:4px; }

  .content-icon{ background:var(--content-clr); }
  .org-icon{ background:var(--org-clr); }
  .lang-icon{ background:var(--lang-clr); }

  /* ---------- Comment ---------- */
  .comment-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 18px; }
  .comment-card label{ font-weight:700; font-size:13px; display:flex; align-items:center; gap:7px; margin-bottom:8px; }
  .comment-card label i{ color:var(--primary); }
  textarea{
    width:100%; min-height:60px; border:1px solid var(--border); border-radius:9px; padding:10px 12px;
    font-family:'Inter',sans-serif; font-size:13px; color:var(--text); resize:vertical; background:var(--primary-lighter);
    outline:none; transition:.15s;
  }
  textarea:focus{ border-color:var(--primary); background:#fff; }

  /* ---------- Actions ---------- */
  .actions{ display:flex; align-items:center; gap:10px; }
  .btn{ border:none; border-radius:10px; font-weight:700; font-family:'Inter',sans-serif; cursor:pointer; transition:.15s ease; display:flex; align-items:center; justify-content:center; gap:8px; font-size:13.5px; }
  .btn-primary{ flex:1; background:var(--primary); color:#fff; padding:12px; box-shadow:0 8px 18px -8px rgba(47,111,176,0.6); }
  .btn-primary:hover{ background:var(--primary-dark); transform:translateY(-1px); }
  .btn-outline{ background:var(--card); color:var(--text-muted); border:1px solid var(--border); padding:12px 15px; }
  .btn-outline:hover{ border-color:var(--primary); color:var(--primary-dark); }
  .saved-toast{ display:flex; align-items:center; gap:6px; background:var(--success-bg); color:var(--success-text); font-size:12.5px; font-weight:600; padding:0; border-radius:10px; opacity:0; height:0; overflow:hidden; transition:.2s; }
  .saved-toast.show{ opacity:1; height:auto; padding:9px 13px; margin-top:2px; }

  .essay-text-card{ display:none; }

  @media(max-width:960px){
    .layout{ grid-template-columns:1fr; }
    .left-panel{ position:static; }
    .viewer{ min-height:380px; }
  }
</style>
</head>
<body>

<nav>
  <a href="/dashboard" class="back-link"><i class="fa-solid fa-arrow-left"></i> Quay lại Bảng điều khiển</a>
  <div class="nav-divider"></div>
  <div class="brand">
    <div class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></div>
    <div class="brand-name">ESSAY-GRADER</div>
  </div>
</nav>

<div class="layout">

  <!-- LEFT: Viewer -->
  <div class="left-panel">
    <div class="viewer-head-title"><i class="fa-solid fa-file-pdf"></i> Bài làm</div>
    <div class="viewer" id="viewer">
      <iframe id="pdfViewer" src="" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none;" title="Bài làm PDF"></iframe>
      <div class="viewer-placeholder" id="viewerPlaceholder">
        <i class="fa-solid fa-file-pdf"></i>
        <p style="font-weight:600;color:var(--text);">Đang tải bài làm...</p>
      </div>
      <div class="viewer-toolbar">
        <button onclick="zoomViewer(-0.1)"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <span id="zoomLevel">100%</span>
        <button onclick="zoomViewer(+0.1)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button onclick="resetZoom()"><i class="fa-solid fa-rotate-right"></i></button>
        <button onclick="downloadPdf()"><i class="fa-solid fa-download"></i></button>
      </div>
    </div>
  </div>

  <!-- RIGHT: Grading panel -->
  <div class="right-panel">

    <div class="student-card">
      <div class="student-avatar" id="studentAvatar">..</div>
      <div>
        <div class="student-name" id="studentName">Đang tải...</div>
        <div class="student-meta" id="studentMeta">Mã sinh viên: ...</div>
      </div>
      <div class="status-pill status-ungraded" id="statusPill">Đang tải</div>
    </div>

    <div class="total-card">
      <div class="total-head">
        <div>
          <div class="total-label">Tổng điểm</div>
          <div class="total-value" id="totalValue">—<span>/ 15</span></div>
        </div>
        <div class="ai-badge"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Đề xuất</div>
      </div>
      <div class="stack-bar">
        <div class="stack-seg" id="segContent" style="width:35%; background:var(--content-clr);"></div>
        <div class="stack-seg" id="segOrg" style="width:25%; background:var(--org-clr);"></div>
        <div class="stack-seg" id="segLang" style="width:25%; background:var(--lang-clr);"></div>
      </div>
      <div class="stack-legend">
        <div><i style="background:var(--content-clr);"></i>Nội dung</div>
        <div><i style="background:var(--org-clr);"></i>Bố cục</div>
        <div><i style="background:var(--lang-clr);"></i>Ngôn ngữ</div>
      </div>
    </div>

    <div class="criteria-card">
      <div class="criteria-row" title="Độ chính xác, chiều sâu lập luận và sự bám sát đề bài">
        <div class="criteria-icon content-icon"><i class="fa-solid fa-lightbulb"></i></div>
        <div class="criteria-label">Nội dung</div>
        <input type="range" id="contentScore" min="0" max="5" step="0.5" value="3.5" oninput="renderScores()">
        <div class="criteria-score" id="contentLabel">3.5<span>/5</span></div>
      </div>
      <div class="criteria-row" title="Cấu trúc, tính mạch lạc và liên kết giữa các đoạn văn">
        <div class="criteria-icon org-icon"><i class="fa-solid fa-diagram-project"></i></div>
        <div class="criteria-label">Bố cục</div>
        <input type="range" id="orgScore" min="0" max="5" step="0.5" value="2.5" oninput="renderScores()">
        <div class="criteria-score" id="orgLabel">2.5<span>/5</span></div>
      </div>
      <div class="criteria-row" title="Ngữ pháp, từ vựng và độ chính xác của diễn đạt">
        <div class="criteria-icon lang-icon"><i class="fa-solid fa-spell-check"></i></div>
        <div class="criteria-label">Ngôn ngữ</div>
        <input type="range" id="langScore" min="0" max="5" step="0.5" value="2.5" oninput="renderScores()">
        <div class="criteria-score" id="langLabel">2.5<span>/5</span></div>
      </div>
    </div>

    <div class="comment-card">
      <label><i class="fa-solid fa-comment-dots"></i> Nhận xét chung</label>
      <textarea id="comment" placeholder="Nhập nhận xét của bạn về bài luận này..."></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="saveScore()"><i class="fa-solid fa-floppy-disk"></i> Lưu điểm</button>
      <button class="btn btn-outline" id="rescoringBtn" onclick="rescoringByAI()"><i class="fa-solid fa-robot"></i> Chấm bằng AI</button>
    </div>
    <div class="saved-toast" id="savedToast"><i class="fa-solid fa-circle-check"></i> Đã lưu điểm thành công</div>

  </div>
</div>

<script>
  const MAX_SCORES = { content: 5, organization: 5, language: 5 };
  const ESSAY_ID = (() => {
    const parts = window.location.pathname.split('/');
    return parseInt(parts[parts.length - 1]) || 0;
  })();
  let currentData = null;
  let viewerZoom = 1;

  function fmt(n) { return n.toFixed(2).replace(/\.?0+$/, ''); }

  function getToken() {
    const token = localStorage.getItem('access_token');
    if (!token) {
      window.location.href = '/login';
      return null;
    }
    return token;
  }

  async function api(path, options = {}) {
    const token = getToken();
    if (!token) return;
    const res = await fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
        ...(options.headers || {}),
      },
    });
    if (res.status === 401) {
      localStorage.removeItem('access_token');
      window.location.href = '/login';
      return;
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: 'Lỗi không xác định' }));
      throw new Error(err.detail || 'Lỗi không xác định');
    }
    return res.json();
  }

  function getScores() {
    return {
      content: parseFloat(document.getElementById('contentScore').value),
      organization: parseFloat(document.getElementById('orgScore').value),
      language: parseFloat(document.getElementById('langScore').value),
    };
  }

  function renderScores() {
    const s = getScores();
    const total = s.content + s.organization + s.language;
    const maxTotal = MAX_SCORES.content + MAX_SCORES.organization + MAX_SCORES.language;

    document.getElementById('contentLabel').innerHTML = fmt(s.content) + `<span>/${MAX_SCORES.content}</span>`;
    document.getElementById('orgLabel').innerHTML = fmt(s.organization) + `<span>/${MAX_SCORES.organization}</span>`;
    document.getElementById('langLabel').innerHTML = fmt(s.language) + `<span>/${MAX_SCORES.language}</span>`;
    document.getElementById('totalValue').innerHTML = fmt(total) + `<span>/ ${maxTotal}</span>`;

    document.getElementById('segContent').style.width = (s.content / maxTotal * 100) + '%';
    document.getElementById('segOrg').style.width = (s.organization / maxTotal * 100) + '%';
    document.getElementById('segLang').style.width = (s.language / maxTotal * 100) + '%';
  }

  function setStatus(status) {
    const pill = document.getElementById('statusPill');
    const labels = { reviewed: 'Đã duyệt', ai_scored: 'AI chấm', unscored: 'Chưa chấm' };
    const classes = { reviewed: 'status-graded', ai_scored: 'status-graded', unscored: 'status-ungraded' };
    pill.textContent = labels[status] || status;
    pill.className = 'status-pill ' + (classes[status] || 'status-ungraded');
  }

  function showToast(msg = 'Đã lưu điểm thành công') {
    const toast = document.getElementById('savedToast');
    toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${msg}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function zoomViewer(delta) {
    viewerZoom = Math.max(0.5, Math.min(2, viewerZoom + delta));
    document.getElementById('zoomLevel').textContent = Math.round(viewerZoom * 100) + '%';
    document.getElementById('pdfViewer').style.transform = `scale(${viewerZoom})`;
    document.getElementById('pdfViewer').style.transformOrigin = 'top left';
  }

  function resetZoom() {
    viewerZoom = 1;
    document.getElementById('zoomLevel').textContent = '100%';
    document.getElementById('pdfViewer').style.transform = 'scale(1)';
  }

  async function downloadPdf() {
    if (!ESSAY_ID) return;
    const token = getToken();
    if (!token) return;
    const res = await fetch(`/api/essays/${ESSAY_ID}/pdf?token=${encodeURIComponent(token)}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `essay_${ESSAY_ID}.pdf`;
    a.click();
    URL.revokeObjectURL(url);
  }

  async function initPdf(essayId, hasPdf) {
    const iframe = document.getElementById('pdfViewer');
    const placeholder = document.getElementById('viewerPlaceholder');
    if (hasPdf) {
      const token = getToken();
      if (!token) return;
      iframe.src = `/api/essays/${essayId}/pdf?token=${encodeURIComponent(token)}#toolbar=0&navpanes=0&scrollbar=0`;
      iframe.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      iframe.style.display = 'none';
      placeholder.innerHTML = '<i class="fa-solid fa-file-pdf"></i><p style="font-weight:600;color:var(--text);">Không có file PDF</p>';
      placeholder.style.display = 'flex';
    }
  }

  async function loadSubmission(id) {
    if (!id) {
      document.getElementById('studentName').textContent = 'Không tìm thấy bài luận';
      return;
    }
    try {
      const data = await api(`/api/essays/${id}`);
      currentData = data;

      document.getElementById('studentName').textContent = data.student.name;
      document.getElementById('studentMeta').textContent = `Mã sinh viên: ${data.student.id}`;
      const initials = data.student.name.split(' ').map(w => w[0]?.toUpperCase() || '').join('').slice(0, 2);
      document.getElementById('studentAvatar').textContent = initials || '..';

      if (data.status !== 'unscored') {
        document.getElementById('contentScore').value = data.content;
        document.getElementById('orgScore').value = data.organization;
        document.getElementById('langScore').value = data.language;
        document.getElementById('comment').value = data.comment || '';
        setStatus(data.status);
      } else {
        document.getElementById('contentScore').value = 0;
        document.getElementById('orgScore').value = 0;
        document.getElementById('langScore').value = 0;
        document.getElementById('comment').value = '';
        setStatus('ungraded');
      }

      initPdf(data.id, data.has_pdf);
      renderScores();
    } catch (err) {
      document.getElementById('studentName').textContent = 'Lỗi tải dữ liệu';
      document.getElementById('studentMeta').textContent = err.message;
    }
  }

  async function rescoringByAI() {
    if (!currentData) return;
    const btn = document.getElementById('rescoringBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang chấm...';
    try {
      await api('/score_one', {
        method: 'POST',
        body: JSON.stringify({
          id: currentData.id,
          prompt: currentData.prompt,
          essay: currentData.essay,
        }),
      });
      await loadSubmission(ESSAY_ID);
      showToast('Đã chấm thành công');
    } catch (err) {
      alert('Lỗi khi chấm: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-robot"></i> Chấm bằng AI';
    }
  }

  async function saveScore() {
    const payload = {
      ...getScores(),
      comment: document.getElementById('comment').value,
    };
    try {
      await api(`/api/essays/${ESSAY_ID}/grade`, {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      setStatus('reviewed');
      showToast();
    } catch (err) {
      alert('Lỗi khi lưu điểm: ' + err.message);
    }
  }

  renderScores();
  loadSubmission(ESSAY_ID);
</script>
</body>
</html>
